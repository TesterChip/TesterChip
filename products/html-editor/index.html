<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TesterChip — HTML Live Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
/* ── TOKENS ── */
:root {
  --bg:      #080c10;
  --surface: #0d1117;
  --card:    #111820;
  --border:  #1e2a38;
  --accent:  #e8b84b;
  --a2:      #4be8c8;
  --a3:      #e84b6b;
  --a4:      #4b8be8;
  --a5:      #a04be8;
  --text:    #c8d6e8;
  --muted:   #526070;
  --mono:    'Share Tech Mono', monospace;
  --head:    'Barlow Condensed', sans-serif;
  --body:    'Barlow', sans-serif;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}

body{
  font-family:var(--body);
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
}

/* ── TOP NAV ── */
.tc-nav{
  flex-shrink:0;
  height:48px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;
  background:rgba(8,12,16,.97);
  border-bottom:1px solid var(--border);
  z-index:200;
}
.tc-logo{
  font-family:var(--mono);font-size:13px;color:var(--accent);
  letter-spacing:.08em;display:flex;align-items:center;gap:9px;
  text-decoration:none;
}
.tc-logo .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 2s infinite}
.tc-logo span{color:var(--text)}
.tc-links{display:flex;gap:6px;flex-wrap:wrap}
.tc-links a{
  font-family:var(--head);font-size:11px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;
  padding:5px 12px;border-radius:2px;
  border:1px solid transparent;
  transition:all .2s;
}
.tc-links a:hover{color:var(--accent);border-color:rgba(232,184,75,.3);background:rgba(232,184,75,.06)}
.tc-links a.active-link{color:var(--accent);border-color:rgba(232,184,75,.3);background:rgba(232,184,75,.08)}

/* ── EDITOR HEADER ── */
.editor-header{
  flex-shrink:0;
  height:52px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  gap:12px;
}
.header-left{display:flex;align-items:center;gap:12px}
.logo-box{
  width:34px;height:34px;border-radius:6px;
  background:linear-gradient(135deg,var(--a4),var(--a2));
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.logo-box svg{opacity:.9}
.header-title{font-family:var(--head);font-size:16px;font-weight:700;color:#fff;letter-spacing:.04em}
.header-sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em}

.header-btns{display:flex;gap:6px;flex-wrap:wrap}
.hbtn{
  font-family:var(--head);font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  padding:7px 14px;border:none;border-radius:2px;
  cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:all .2s;
}
.hbtn-upload { background:rgba(75,139,232,.15);border:1px solid rgba(75,139,232,.3);color:var(--a4) }
.hbtn-upload:hover { background:rgba(75,139,232,.28) }
.hbtn-download { background:rgba(160,75,232,.15);border:1px solid rgba(160,75,232,.3);color:var(--a5) }
.hbtn-download:hover { background:rgba(160,75,232,.28) }
.hbtn-copy { background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted) }
.hbtn-copy:hover { border-color:var(--muted);color:var(--text) }
.hbtn-reset { background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted) }
.hbtn-reset:hover { border-color:var(--a3);color:var(--a3) }
.hbtn-run { background:rgba(75,232,112,.15);border:1px solid rgba(75,232,112,.3);color:#4be870 }
.hbtn-run:hover { background:rgba(75,232,112,.28);transform:translateY(-1px) }

/* ── MAIN LAYOUT ── */
.main-content{
  display:flex;
  flex:1;
  overflow:hidden;
  min-height:0;
}

/* ── EDITOR SIDE ── */
.editor-section{
  width:50%;
  display:flex;flex-direction:column;
  border-right:1px solid var(--border);
  min-height:0;
}

/* tab bar */
.tabs{
  flex-shrink:0;
  display:flex;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.tab{
  padding:10px 20px;
  cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;
  font-family:var(--head);font-size:12px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);transition:all .2s;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text)}
.tab.active.html{color:#fb923c;border-bottom-color:#fb923c}
.tab.active.css {color:var(--a4);border-bottom-color:var(--a4)}
.tab.active.js  {color:var(--accent);border-bottom-color:var(--accent)}

/* editor panes */
.editor-area{flex:1;position:relative;min-height:0;overflow:hidden}
.editor-pane{display:none;height:100%}
.editor-pane.active{display:block}

textarea{
  width:100%;height:100%;
  background:var(--bg);color:var(--text);
  border:none;padding:16px;
  font-family:var(--mono);font-size:13px;line-height:1.65;
  resize:none;outline:none;
  tab-size:2;
}
textarea::placeholder{color:var(--muted)}
textarea:focus{background:#0a0f16}

/* line numbers feel via left border */
.editor-pane textarea{
  border-left:3px solid var(--border);
}
.editor-pane.active.html-pane textarea{border-left-color:#fb923c}
.editor-pane.active.css-pane  textarea{border-left-color:var(--a4)}
.editor-pane.active.js-pane   textarea{border-left-color:var(--accent)}

/* ── PREVIEW SIDE ── */
.preview-section{
  width:50%;
  display:flex;flex-direction:column;
  background:#fff;
  min-height:0;
}

.preview-header{
  flex-shrink:0;
  height:42px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.preview-header-left{
  display:flex;align-items:center;gap:8px;
  font-family:var(--head);font-size:13px;font-weight:700;
  color:#fff;text-transform:uppercase;letter-spacing:.06em;
}
.preview-dot{width:7px;height:7px;border-radius:50%;background:#4be870;animation:blink 1.5s infinite}
.preview-status{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.12em}

iframe{flex:1;border:none;background:#fff;min-height:0}

/* ── HIDDEN FILE INPUT ── */
input[type="file"]{display:none}

/* ── STATUS BAR ── */
.status-bar{
  flex-shrink:0;
  height:22px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  background:var(--surface);
  border-top:1px solid var(--border);
  font-family:var(--mono);font-size:10px;color:var(--muted);
  letter-spacing:.1em;
}
.status-left{display:flex;gap:20px}
.status-right{color:var(--accent)}

/* ── ANIMATIONS ── */
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .main-content{flex-direction:column}
  .editor-section,.preview-section{width:100%;height:50%}
  .tc-links{display:none}
  .header-btns{gap:4px}
  .hbtn{padding:6px 10px;font-size:10px}
  .header-title{font-size:13px}
}
</style>
</head>
<body>

<!-- ── TOP NAV ── -->
<nav class="tc-nav">
  <a class="tc-logo" href="../../index.html">
    <div class="dot"></div>
    Tester<span>Chip</span>
  </a>
  <div class="tc-links">
    <a href="../../index.html"><i class="fa-solid fa-house"></i> Home</a>
    <a href="../index.html"><i class="fa-solid fa-box"></i> Products</a>
    <a href="../html-editor/index.html" class="active-link"><i class="fa-solid fa-file-code"></i> HTML Editor</a>
    <a href="../python-editor/index.html"><i class="fa-brands fa-python"></i> Python Editor</a>
    <a href="../flood-detector/index.html"><i class="fa-solid fa-water"></i> Flood Detector</a>
    <a href="../pcb-generator/index.html"><i class="fa-solid fa-microchip"></i> PCB Generator</a>
  </div>
</nav>

<!-- ── EDITOR HEADER ── -->
<div class="editor-header">
  <div class="header-left">
    <div class="logo-box">
      <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
        <rect x="6"  y="6"  width="8" height="8" rx="2" fill="white" opacity=".9"/>
        <rect x="18" y="6"  width="8" height="8" rx="2" fill="white" opacity=".7"/>
        <rect x="6"  y="18" width="8" height="8" rx="2" fill="white" opacity=".7"/>
        <rect x="18" y="18" width="8" height="8" rx="2" fill="white" opacity=".9"/>
        <circle cx="16" cy="16" r="2" fill="white"/>
      </svg>
    </div>
    <div>
      <div class="header-title">TesterChip</div>
      <div class="header-sub">HTML Live Editor</div>
    </div>
  </div>

  <div class="header-btns">
    <button class="hbtn hbtn-upload" onclick="uploadProject()">
      <i class="fa-solid fa-upload"></i> Upload
    </button>
    <button class="hbtn hbtn-download" onclick="downloadProject()">
      <i class="fa-solid fa-download"></i> Download
    </button>
    <button class="hbtn hbtn-copy" id="copyBtn" onclick="copyCode()">
      <i class="fa-regular fa-copy"></i> Copy
    </button>
    <button class="hbtn hbtn-reset" onclick="resetCode()">
      <i class="fa-solid fa-rotate-left"></i> Reset
    </button>
    <button class="hbtn hbtn-run" onclick="runCode()">
      <i class="fa-solid fa-play"></i> Run
    </button>
  </div>
</div>

<!-- ── MAIN ── -->
<div class="main-content">

  <!-- EDITOR -->
  <div class="editor-section">
    <div class="tabs">
      <button class="tab active html" onclick="switchTab('html')">
        <i class="fa-brands fa-html5"></i> HTML
      </button>
      <button class="tab css" onclick="switchTab('css')">
        <i class="fa-brands fa-css3-alt"></i> CSS
      </button>
      <button class="tab js" onclick="switchTab('js')">
        <i class="fa-brands fa-js"></i> JavaScript
      </button>
    </div>

    <div class="editor-area">
      <div class="editor-pane active html-pane" id="html-pane">
        <textarea id="html-code" oninput="updatePreview()" spellcheck="false"><h1>Hello World!</h1>
<p>Start coding your project here...</p>
<p>Note: This is still in its early phase. So there might be problems in JavaScript.</p></textarea>
      </div>

      <div class="editor-pane css-pane" id="css-pane">
        <textarea id="css-code" oninput="updatePreview()" spellcheck="false">body {
  font-family: Arial, sans-serif;
  padding: 20px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
}

h1 {
  color: #fff;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}</textarea>
      </div>

      <div class="editor-pane js-pane" id="js-pane">
        <textarea id="js-code" oninput="updatePreview()" spellcheck="false">// Write your JavaScript here
console.log("Ready to code!");

// Example: Add click event
// document.querySelector("h1")?.addEventListener("click", () => {
//   alert("Hello from TesterChip!");
// });</textarea>
      </div>
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="preview-section">
    <div class="preview-header">
      <div class="preview-header-left">
        <div class="preview-dot"></div>
        Live Preview
      </div>
      <span class="preview-status">Auto-refresh enabled</span>
    </div>
    <iframe id="preview"></iframe>
  </div>

</div>

<!-- STATUS BAR -->
<div class="status-bar">
  <div class="status-left">
    <span id="statusLang">HTML</span>
    <span id="statusLines">Lines: —</span>
    <span id="statusChars">Chars: —</span>
  </div>
  <div class="status-right">TesterChip Live Editor</div>
</div>

<!-- hidden file input -->
<input type="file" id="file-input" accept=".json" onchange="handleFileUpload(event)"/>

<script>
let updateTimeout;

/* ── TAB SWITCHING ── */
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.editor-pane').forEach(p => p.classList.remove('active'));
  document.querySelector('.tab.' + tab).classList.add('active');
  document.getElementById(tab + '-pane').classList.add('active');

  // update status bar
  const labels = { html:'HTML', css:'CSS', js:'JavaScript' };
  document.getElementById('statusLang').textContent = labels[tab] || tab.toUpperCase();
  updateStatusBar(tab);
}

function updateStatusBar(tab) {
  const map = { html:'html-code', css:'css-code', js:'js-code' };
  const id  = map[tab] || 'html-code';
  const val = document.getElementById(id).value;
  document.getElementById('statusLines').textContent = 'Lines: ' + val.split('\n').length;
  document.getElementById('statusChars').textContent = 'Chars: ' + val.length;
}

/* ── PREVIEW ── */
function updatePreview() {
  clearTimeout(updateTimeout);
  updateTimeout = setTimeout(() => {
    const html = document.getElementById('html-code').value;
    const css  = document.getElementById('css-code').value;
    const js   = document.getElementById('js-code').value;
    const content = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <style>${css}</style>
</head>
<body>
  ${html}
  <script>
    try { ${js} } catch(err) { console.error('JavaScript Error:', err); }
  <\/script>
</body>
</html>`;
    document.getElementById('preview').srcdoc = content;
  }, 500);
}

function runCode() { clearTimeout(updateTimeout); updatePreview(); }

/* ── RESET ── */
function resetCode() {
  if (!confirm('Reset all code to default?')) return;
  document.getElementById('html-code').value =
    '<h1>Hello World!</h1>\n<p>Start coding your project here...</p>';
  document.getElementById('css-code').value =
    'body {\n  font-family: Arial, sans-serif;\n  padding: 20px;\n  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n  color: white;\n}\n\nh1 {\n  color: #fff;\n  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);\n}';
  document.getElementById('js-code').value =
    '// Write your JavaScript here\nconsole.log("Ready to code!");\n\n// Example: Add click event\n// document.querySelector("h1")?.addEventListener("click", () => {\n//   alert("Hello from TesterChip!");\n// });';
  updatePreview();
}

/* ── COPY ── */
function copyCode() {
  const html = document.getElementById('html-code').value;
  const css  = document.getElementById('css-code').value;
  const js   = document.getElementById('js-code').value;
  const code = `HTML:\n${html}\n\nCSS:\n${css}\n\nJavaScript:\n${js}`;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
    btn.style.color       = 'var(--a2)';
    btn.style.borderColor = 'var(--a2)';
    setTimeout(() => {
      btn.innerHTML         = '<i class="fa-regular fa-copy"></i> Copy';
      btn.style.color       = '';
      btn.style.borderColor = '';
    }, 2000);
  });
}

/* ── DOWNLOAD ── */
function downloadProject() {
  const data = {
    html:      document.getElementById('html-code').value,
    css:       document.getElementById('css-code').value,
    javascript:document.getElementById('js-code').value,
    timestamp: new Date().toISOString(),
    version:   '1.0',
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `testerchip-project-${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ── UPLOAD ── */
function uploadProject() { document.getElementById('file-input').click(); }

function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!file.name.endsWith('.json')) { alert('Please upload a valid JSON file'); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.html       !== undefined) document.getElementById('html-code').value = data.html;
      if (data.css        !== undefined) document.getElementById('css-code').value  = data.css;
      if (data.javascript !== undefined) document.getElementById('js-code').value   = data.javascript;
      updatePreview();
      alert('Project loaded successfully!');
    } catch (err) {
      alert('Error loading file: Invalid JSON format');
      console.error(err);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ── STATUS BAR LIVE UPDATE ── */
['html-code','css-code','js-code'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    const active = document.querySelector('.tab.active');
    if (active) {
      const map = { html:'html', css:'css', js:'js' };
      const key = Object.keys(map).find(k => active.classList.contains(k));
      if (key) updateStatusBar(key);
    }
  });
});

/* ── INIT ── */
window.onload = function() {
  updatePreview();
  updateStatusBar('html');
};
</script>
</body>
</html>
