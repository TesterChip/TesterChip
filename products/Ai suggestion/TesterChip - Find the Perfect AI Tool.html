<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>TesterChip — Find the Perfect AI Tool</title>
<meta name="description" content="Discover the best AI tools for coding, writing, image generation, video editing, and more. AI-powered tool finder with smart recommendations."/>
<meta name="keywords" content="AI tools, artificial intelligence, ChatGPT, Midjourney, machine learning tools, AI assistant, AI writing, AI image generator, AI video editor, productivity tools, automation"/>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
/* ── TOKENS ── */
:root {
  --bg:      #080c10;
  --surface: #0d1117;
  --card:    #111820;
  --border:  #1e2a38;
  --accent:  #e8b84b;
  --a2:      #4be8c8;
  --a3:      #e84b6b;
  --a4:      #4b8be8;
  --a5:      #a04be8;
  --a6:      #4be870;
  --text:    #c8d6e8;
  --muted:   #526070;
  --mono:    'Share Tech Mono', monospace;
  --head:    'Barlow Condensed', sans-serif;
  --body:    'Barlow', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6;overflow-x:hidden;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");background-size:180px;pointer-events:none;z-index:0}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── NAV ── */
.tc-nav{position:fixed;top:0;left:0;right:0;z-index:300;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:rgba(8,12,16,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.tc-logo{font-family:var(--mono);font-size:14px;color:var(--accent);letter-spacing:.08em;display:flex;align-items:center;gap:10px;text-decoration:none}
.tc-logo .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 2s infinite}
.tc-logo span{color:var(--text)}
.tc-links{display:flex;gap:20px}
.tc-links a{font-family:var(--head);font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
.tc-links a:hover{color:var(--accent)}

/* ── CONTAINER ── */
.container{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 40px 80px}

/* ── HERO ── */
.hero{text-align:center;padding:100px 20px 48px;position:relative}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(232,184,75,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(232,184,75,.04) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 90% 70% at 50% 40%,black 20%,transparent 100%);pointer-events:none}
.hero-glow{position:absolute;width:600px;height:400px;background:radial-gradient(circle,rgba(75,139,232,.08) 0%,transparent 70%);top:10%;left:50%;transform:translateX(-50%);pointer-events:none}

/* badge */
.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 16px;background:rgba(75,139,232,.08);border:1px solid rgba(75,139,232,.25);border-radius:2px;font-family:var(--mono);font-size:11px;color:var(--a4);letter-spacing:.18em;text-transform:uppercase;margin-bottom:22px}
.badge svg{width:14px;height:14px}

h1{font-family:var(--head);font-size:clamp(36px,7vw,86px);font-weight:900;line-height:.92;letter-spacing:-.02em;color:#fff;text-transform:uppercase;margin-bottom:14px}
.gradient-colour{color:var(--accent);-webkit-text-fill-color:var(--accent);background:none}
.gradient-text{color:var(--a2);-webkit-text-fill-color:var(--a2);background:none}

.subtitle{font-size:15px;color:var(--muted);max-width:520px;margin:0 auto 36px;font-weight:300;line-height:1.75}

/* ── SEARCH ── */
.search-box{position:relative;max-width:700px;margin:0 auto 32px}
.search-input{width:100%;padding:14px 140px 14px 46px;font-size:14px;font-family:var(--mono);background:var(--card);border:1px solid var(--border);border-radius:3px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.search-input::placeholder{color:var(--muted)}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,184,75,.1)}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-btn{position:absolute;right:6px;top:6px;padding:8px 18px;background:var(--accent);color:#080c10;border:none;border-radius:2px;font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s}
.search-btn:hover{background:#f0c860;transform:translateY(-1px)}
.search-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ── EXAMPLES ── */
.examples{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:40px}
.example-btn{padding:6px 14px;background:transparent;border:1px solid var(--border);border-radius:2px;font-family:var(--mono);font-size:11px;color:var(--muted);cursor:pointer;letter-spacing:.08em;transition:all .2s}
.example-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(232,184,75,.06)}

/* ── STATS ── */
.stats{display:flex;justify-content:center;gap:48px;padding:20px 40px;background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:32px;position:relative;z-index:1}
.stat{text-align:center}
.stat-value{font-family:var(--head);font-size:28px;font-weight:700;color:var(--accent);display:block}
.stat-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}

/* ── TODO ── */
.todo-container{max-width:700px;margin:0 auto 36px;background:var(--card);border:1px solid var(--border);border-radius:4px;padding:24px;position:relative;overflow:hidden;transition:padding .3s}
.todo-container::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--a4),var(--a2))}
.todo-container.collapsed{padding:16px 24px}
.todo-container.collapsed .todo-content{display:none}
.todo-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.todo-container.collapsed .todo-header{margin-bottom:0}
.todo-title{font-family:var(--head);font-size:18px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.todo-title svg{color:var(--a2);flex-shrink:0}
.todo-toggle{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--border);padding:5px 12px;border-radius:2px;cursor:pointer;transition:all .2s}
.todo-toggle:hover{border-color:var(--accent);color:var(--accent)}
.todo-input-box{display:flex;gap:8px;margin-bottom:18px}
.todo-input{flex:1;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:var(--mono);font-size:13px;outline:none;transition:border-color .2s}
.todo-input::placeholder{color:var(--muted)}
.todo-input:focus{border-color:var(--a2);box-shadow:0 0 0 3px rgba(75,232,200,.08)}
.todo-add-btn{padding:10px 18px;background:var(--a2);color:#080c10;border:none;border-radius:3px;cursor:pointer;font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;transition:all .2s}
.todo-add-btn:hover{background:#6ef5dc}
.todo-list{list-style:none}
.todo-item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:3px;margin-bottom:6px;transition:all .2s}
.todo-item:hover{border-color:rgba(75,232,200,.3)}
.todo-item.completed{opacity:.5}
.todo-item.completed .todo-text{text-decoration:line-through;color:var(--muted)}
.todo-checkbox{width:20px;height:20px;border:1px solid var(--border);border-radius:3px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.todo-checkbox.checked{background:var(--a2);border-color:var(--a2)}
.todo-checkbox svg{display:none;width:12px;height:12px}
.todo-checkbox.checked svg{display:block}
.todo-text{flex:1;color:var(--text);font-size:13px;font-family:var(--mono)}
.todo-delete{background:none;border:none;color:var(--a3);cursor:pointer;padding:3px 6px;border-radius:2px;font-size:16px;opacity:0;transition:all .2s}
.todo-item:hover .todo-delete{opacity:1}
.todo-delete:hover{background:rgba(232,75,107,.12)}
.todo-empty{text-align:center;color:var(--muted);padding:20px;font-family:var(--mono);font-size:12px;letter-spacing:.08em}

/* ── FILTERS ── */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px;justify-content:center;position:relative;z-index:1}
.filter-btn{padding:6px 14px;background:transparent;border:1px solid var(--border);border-radius:2px;cursor:pointer;font-family:var(--head);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);transition:all .2s}
.filter-btn:hover{border-color:var(--muted);color:var(--text)}
.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,184,75,.08)}

/* ── RESULTS ── */
.results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;position:relative;z-index:1}
.results-header h2{font-family:var(--head);font-size:28px;font-weight:700;color:#fff;text-transform:uppercase}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;position:relative;z-index:1}

/* ── CARD ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:22px;transition:all .25s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.card:hover{border-color:rgba(232,184,75,.4);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card:hover::before{transform:scaleX(1)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.card-icon{width:42px;height:42px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:15px;flex-shrink:0}
.card-title{font-family:var(--head);font-size:18px;font-weight:700;color:#fff;margin-bottom:4px;letter-spacing:.02em}
.card-category{display:inline-block;padding:3px 10px;background:rgba(232,184,75,.1);border:1px solid rgba(232,184,75,.25);border-radius:2px;font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase}
.card-desc{color:var(--muted);font-size:13px;font-weight:300;line-height:1.6;margin-bottom:14px;word-wrap:break-word}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{padding:3px 9px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:2px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em}
.card-info{display:flex;gap:12px;font-family:var(--mono);font-size:11px;color:var(--a2);margin-bottom:12px}
.rating{display:flex;gap:2px;margin-bottom:14px;font-size:14px}
.star{color:var(--accent)}.star.empty{color:var(--border)}
.match-score{padding:3px 10px;background:rgba(75,232,200,.08);border:1px solid rgba(75,232,200,.2);border-radius:2px;font-family:var(--mono);font-size:10px;color:var(--a2);letter-spacing:.08em;white-space:nowrap}
.card-btn{width:100%;padding:11px;background:var(--accent);color:#080c10;border:none;border-radius:3px;cursor:pointer;font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.card-btn:hover{background:#f0c860;transform:translateY(-1px)}
.card-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:80px 20px}
.empty-icon{width:70px;height:70px;margin:0 auto 18px;background:var(--card);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}

/* ── SPINNER ── */
.spinner{border:2px solid rgba(255,255,255,.2);border-top:2px solid #080c10;border-radius:50%;width:14px;height:14px;animation:spin .7s linear infinite}

/* ── ANIMATIONS ── */
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── RESPONSIVE ── */
@media(max-width:960px){.tc-links{display:none}}
@media(max-width:768px){
  .tc-nav{padding:0 16px}
  .container{padding:0 16px 60px}
  .hero{padding:80px 16px 36px}
  h1{font-size:28px}
  .subtitle{font-size:14px}
  .search-input{padding:14px 14px 14px 42px}
  .search-btn{position:static;width:100%;margin-top:10px;justify-content:center}
  .search-box{display:flex;flex-direction:column}
  .search-icon{top:38px;transform:none}
  .stats{flex-wrap:wrap;gap:24px;padding:16px}
  .todo-header{flex-direction:column;align-items:stretch;gap:10px}
  .todo-input-box{flex-direction:column}
  .grid{grid-template-columns:1fr}
  .card-header{flex-direction:column;gap:10px}
  .todo-item .todo-delete{opacity:1}
}
@media(max-width:480px){h1{font-size:22px}.stat-value{font-size:22px}}
@media(hover:none) and (pointer:coarse){
  button,.example-btn,.filter-btn,.card-btn,a{-webkit-tap-highlight-color:rgba(232,184,75,.2)}
}
</style>
</head>
<body>

<!-- ── NAV ── -->
<nav class="tc-nav">
  <a class="tc-logo" href="#">
    <div class="dot"></div>
    Tester<span>Chip</span>
  </a>
  <div class="tc-links">
    <a href="#">Home</a>
    <a href="#tools">Tools</a>
    <a href="#todo">Tasks</a>
  </div>
</nav>

<div class="container">

  <!-- ── HERO ── -->
  <div class="hero">
    <div class="hero-grid"></div>
    <div class="hero-glow"></div>

    <div class="badge">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
      </svg>
      AI-Powered Tool Discovery
    </div>

    <h1>
      <span class="gradient-colour">TesterChip</span> — Find the Perfect
      <span class="gradient-text"> AI Tool</span>
    </h1>

    <p class="subtitle">Discover cutting-edge AI tools for coding, writing, design, video editing, automation, and more</p>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input
        type="text" class="search-input" id="searchInput"
        placeholder="e.g., 'build a website', 'edit video', 'write marketing copy'"
        onkeypress="handleKeyPress(event)"
      />
      <button class="search-btn" id="searchBtn" onclick="performSearch()">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Find AI Tools
      </button>
    </div>

    <div class="examples" id="examples"></div>
  </div>

  <!-- ── TODO ── -->
  <div class="todo-container" id="todoContainer">
    <div class="todo-header">
      <div class="todo-title">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
        </svg>
        What I'm Working On
      </div>
      <button class="todo-toggle" onclick="toggleTodo()">
        <span id="todoToggleText">Hide</span>
      </button>
    </div>
    <div class="todo-content">
      <div class="todo-input-box">
        <input
          type="text" class="todo-input" id="todoInput"
          placeholder="What are you working on today?"
          onkeypress="handleTodoKeyPress(event)"
        />
        <button class="todo-add-btn" onclick="addTodo()">
          <i class="fa-solid fa-plus"></i> Add Task
        </button>
      </div>
      <ul class="todo-list" id="todoList">
        <li class="todo-empty">Add your first task to get started!</li>
      </ul>
    </div>
  </div>

  <!-- ── STATS ── -->
  <div class="stats">
    <div class="stat"><span class="stat-value" id="totalTools">85</span><span class="stat-label">AI Tools</span></div>
    <div class="stat"><span class="stat-value">24</span><span class="stat-label">Categories</span></div>
    <div class="stat"><span class="stat-value">150+</span><span class="stat-label">Keywords</span></div>
  </div>

  <!-- ── FILTERS + RESULTS ── -->
  <div class="filters" id="categoryFilters"></div>
  <div id="resultsHeader"></div>
  <div class="grid" id="toolsGrid" id="tools"></div>

</div><!-- /container -->

<script>
/* ══════════════════════════════════════
   TODO LIST
════════════════════════════════════════ */
let todos = JSON.parse(localStorage.getItem('aiToolFinderTodos')) || [];

function renderTodos() {
  const todoList = document.getElementById('todoList');
  if (todos.length === 0) {
    todoList.innerHTML = '<li class="todo-empty">Add your first task to get started!</li>';
    return;
  }
  todoList.innerHTML = todos.map((todo, index) => `
    <li class="todo-item ${todo.completed ? 'completed' : ''}">
      <div class="todo-checkbox ${todo.completed ? 'checked' : ''}" onclick="toggleTodoItem(${index})">
        <svg fill="none" stroke="white" viewBox="0 0 24 24" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <span class="todo-text">${escapeHtml(todo.text)}</span>
      <button class="todo-delete" onclick="deleteTodo(${index})">×</button>
    </li>
  `).join('');
}

function addTodo() {
  const input = document.getElementById('todoInput');
  const text  = input.value.trim();
  if (text) { todos.push({ text, completed: false }); saveTodos(); renderTodos(); input.value = ''; }
}
function toggleTodoItem(index) { todos[index].completed = !todos[index].completed; saveTodos(); renderTodos(); }
function deleteTodo(index)      { todos.splice(index, 1); saveTodos(); renderTodos(); }
function saveTodos()            { localStorage.setItem('aiToolFinderTodos', JSON.stringify(todos)); }
function toggleTodo() {
  const c = document.getElementById('todoContainer');
  const t = document.getElementById('todoToggleText');
  c.classList.toggle('collapsed');
  t.textContent = c.classList.contains('collapsed') ? 'Show' : 'Hide';
}
function handleTodoKeyPress(e) { if (e.key === 'Enter') addTodo(); }
function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
renderTodos();

/* ══════════════════════════════════════
   VISIT WEBSITE
════════════════════════════════════════ */
function visitWebsite(url, btn) {
  if (!url || typeof url !== 'string') return;
  url = url.trim();
  if (!url.startsWith('http://') && !url.startsWith('https://')) return;
  if (btn && btn instanceof HTMLButtonElement) { btn.disabled = true; btn.style.cursor = 'not-allowed'; }
  window.location.href = url;
}

/* ══════════════════════════════════════
   CATEGORIES
════════════════════════════════════════ */
const categories = {
  all:'All Tools', coding:'Coding', writing:'Writing',
  image_generation:'Images', video_generation:'Video', audio_voice:'Audio',
  data_analysis:'Data', marketing:'Marketing', customer_support:'Support',
  education:'Education', presentation:'Slides', research:'Research',
  d_animation:'3D', website_building:'Websites', translation:'Translation',
  hr_recruitment:'HR', legal:'Legal', healthcare:'Healthcare',
  finance:'Finance', project_management:'Projects', general_assistant:'Assistant',
  automation:'Automation', seo:'SEO', design:'Design', productivity:'Productivity',
};

const gradients = {
  coding:'linear-gradient(135deg,#10b981,#14b8a6)',
  writing:'linear-gradient(135deg,#3b82f6,#06b6d4)',
  image_generation:'linear-gradient(135deg,#ec4899,#f43f5e)',
  video_generation:'linear-gradient(135deg,#a855f7,#8b5cf6)',
  audio_voice:'linear-gradient(135deg,#f59e0b,#f97316)',
  data_analysis:'linear-gradient(135deg,#0ea5e9,#0284c7)',
  marketing:'linear-gradient(135deg,#ef4444,#dc2626)',
  customer_support:'linear-gradient(135deg,#22c55e,#16a34a)',
  education:'linear-gradient(135deg,#eab308,#ca8a04)',

  {name:'Notion AI',category:'project_management',description:'AI-powered features in Notion for note-taking, project management, and knowledge sharing',url:'https://www.notion.so/ai',rating:4,tags:['Project Management','AI+Project Management','Knowledge Sharing'],pricing:'Freemium',keywords:'notion, AI project management, note-taking, knowledge sharing, collaboration tools'},
];

/* ══════════════════════════════════════
   ENHANCE KEYWORDS
════════════════════════════════════════ */
const enhancedAiTools = aiTools.map(tool => {
  const base      = (tool.keywords || '').toLowerCase();
  const name      = tool.name.toLowerCase();
  const tags      = (tool.tags || []).join(', ').toLowerCase();
  const catLabel  = categories[tool.category] || '';
  const catKw     = `${tool.category.replace(/_/g,' ')}, ${catLabel}`.toLowerCase();
  const combined  = [base, name, tags, catKw].map(s => s.trim()).filter(Boolean).join(', ');
  const unique    = Array.from(new Set(combined.split(/[,\s]+/).filter(Boolean)));
  return { ...tool, keywords: unique.join(', ') };
});

let currentFilter = 'all';
let searchResults = [...enhancedAiTools];

/* ══════════════════════════════════════
   INIT
════════════════════════════════════════ */
function initExamples() {
  const examples = ['Write a blog post','Edit a video','Create logo designs','Analyze spreadsheet data','Build a landing page','Generate product images'];
  document.getElementById('examples').innerHTML = examples
    .map(ex => `<button class="example-btn" onclick="searchExample('${ex}')">${ex}</button>`).join('');
}

function initFilters() {
  document.getElementById('categoryFilters').innerHTML = Object.entries(categories)
    .map(([key, label]) =>
      `<button class="filter-btn ${key === 'all' ? 'active' : ''}" onclick="filterByCategory('${key}', event)">${label}</button>`
    ).join('');
}

function filterByCategory(category, e) {
  currentFilter = category;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (e && e.target) e.target.classList.add('active');
  searchResults = category === 'all' ? [...enhancedAiTools] : enhancedAiTools.filter(t => t.category === category);
  displayResults();
}

function searchExample(query) {
  document.getElementById('searchInput').value = query;
  performSearch();
}

function handleKeyPress(e) { if (e.key === 'Enter') performSearch(); }

function performSearch() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!query) {
    searchResults = currentFilter === 'all' ? [...enhancedAiTools] : enhancedAiTools.filter(t => t.category === currentFilter);
    displayResults();
    return;
  }
  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Searching...';
  setTimeout(() => {
    searchResults = enhancedAiTools
      .filter(t => currentFilter === 'all' || t.category === currentFilter)
      .map(t => ({ ...t, matchScore: calculateMatchScore(t, query) }))
      .filter(t => t.matchScore > 0)
      .sort((a, b) => b.matchScore - a.matchScore);
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Find AI Tools';
    displayResults();
  }, 800);
}

function calculateMatchScore(tool, query) {
  const words = query.split(/\s+/).filter(Boolean);
  let score   = 0;
  const name  = tool.name.toLowerCase();
  const desc  = tool.description.toLowerCase();
  const kw    = (tool.keywords || '').toLowerCase();
  const tags  = (tool.tags || []).join(' ').toLowerCase();
  const cat   = (tool.category + ' ' + (categories[tool.category] || '')).toLowerCase();
  const W     = { name:12, description:10, keywords:10, tags:8, category:12 };
  words.forEach(w => {
    if (!w) return;
    if (name.includes(w)) score += W.name;
    if (desc.includes(w)) score += W.description;
    if (kw.includes(w))   score += W.keywords;
    if (tags.includes(w)) score += W.tags;
    if (cat.includes(w))  score += W.category;
  });
  const max = words.length * 52;
  const kPct = max > 0 ? Math.min(100, (score / max) * 100) : 0;
  if (kPct === 0) return 0;
  const sPct = ((tool.rating || 0) / 5) * 100;
  return Math.min(99, Math.max(1, Math.round(kPct * 0.8 + sPct * 0.2)));
}

function displayResults() {
  const grid   = document.getElementById('toolsGrid');
  const header = document.getElementById('resultsHeader');
  if (searchResults.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">
          <i class="fa-solid fa-face-frown" style="font-size:28px"></i>
        </div>
        <h3 style="font-family:var(--head);font-size:22px;font-weight:700;color:#fff;margin-bottom:8px;text-transform:uppercase">No Tools Found</h3>
        <p style="color:var(--muted);font-size:13px">Try adjusting your search or browse all categories</p>
      </div>`;
    header.innerHTML = '';
    return;
  }
  header.innerHTML = `
    <div class="results-header">
      <h2>${searchResults.length} ${searchResults.length === 1 ? 'Tool' : 'Tools'} Found</h2>
    </div>`;
  grid.innerHTML = searchResults.map(tool => {
    const gradient = gradients[tool.category] || gradients.general_assistant;
    const icon     = tool.name.substring(0, 2).toUpperCase();
    return `
      <div class="card">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:12px">
            <div class="card-icon" style="background:${gradient}">${icon}</div>
            <div>
              <div class="card-title">${tool.name}</div>
              <span class="card-category">${categories[tool.category]}</span>
            </div>
          </div>
          ${typeof tool.matchScore === 'number' ? `<span class="match-score">${tool.matchScore}% match</span>` : ''}
        </div>
        <p class="card-desc">${tool.description}</p>
        <div class="card-tags">${tool.tags.slice(0,3).map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <div class="rating">${'<span class="star">★</span>'.repeat(tool.rating)}${'<span class="star empty">☆</span>'.repeat(5-tool.rating)}</div>
        <div class="card-info"><span><i class="fa-solid fa-tag" style="font-size:10px"></i> ${tool.pricing}</span></div>
        <button type="button" class="card-btn" onclick="visitWebsite('${(tool.url||'').replace(/'/g,"&#39;")}',this)">
          Visit Website <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>`;
  }).join('');
  document.getElementById('totalTools').textContent = enhancedAiTools.length;
}

/* ── BOOT ── */
initExamples();
initFilters();
displayResults();
</script>
</body>
</html>
